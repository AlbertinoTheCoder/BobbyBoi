name: Build & check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    name: Windows / .NET 10
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build BobbyBoi.slnx -c Release
      - name: Render and physics checks
        run: dotnet src/BobbyBoi/bin/Release/net10.0-windows/BobbyBoi.dll --self-test
      - name: Sound synthesis and mixer checks
        run: dotnet src/BobbyBoi/bin/Release/net10.0-windows/BobbyBoi.dll --sfx-test
